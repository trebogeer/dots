general {
        colors = true
        interval = 5
        output_format = "i3bar"
}

#order += "keyboard"
order += "ipv6"
order += "disk /"
order += "ethernet eno1"
#order += "wireless wlan0"
#order += "battery 0"
order += "load"
order += "time"

# The interface names ("ethernet eno1", "wireless wlan0") and the
# wireless/battery modules are machine specific.  ~/.i3/scripts/
# machine_setup rewrites them from the hardware it finds.  Without
# the script, adjust them by hand:
#     ip -o link show
#
# Uncomment the blocks below that apply to your hardware.
# Left out they would always show up as "down"/"no" in the bar.

ethernet eno1 {
        # if you use %speed, i3status requires root privileges
        format_up = "E: %ip (%speed)"
        format_down = "E: down"
}

#wireless wlan0 {
#        format_up = "W: (%quality at %essid) %ip"
#        format_down = "W: down"
#}

#battery 0 {
#        format = "%status %percentage %remaining"
#}

# NetworkManager is used instead of dhclient, so there is no
# dhclient pidfile to watch.
#run_watch DHCP {
#        pidfile = "/var/run/dhclient*.pid"
#}

#run_watch VPN {
#        pidfile = "/var/run/vpnc/pid"
#}

time {
#        format = "%Y-%m-%d %H:%M:%S"
       format = " %a %e %b'%y %l:%M%P"
}

load {
        format = "%1min"
}

disk "/" {
        format = "%free"
}
