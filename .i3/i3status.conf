general {
        colors = true
        interval = 5
        output_format = "i3bar"
}

#order += "keyboard"
order += "ipv6"
order += "disk /"
order += "ethernet eno1"
order += "load"
order += "time"

# This machine has a single wired interface, eno1, managed by
# NetworkManager.  Adjust the name if it differs:
#     ip -o link show
#
# Uncomment the blocks below that apply to your hardware.
# Left out they would always show up as "down"/"no" in the bar.

ethernet eno1 {
        # if you use %speed, i3status requires root privileges
        format_up = "E: %ip (%speed)"
        format_down = "E: down"
}

#wireless wlan0 {
#        format_up = "W: (%quality at %essid) %ip"
#        format_down = "W: down"
#}

#battery 0 {
#        format = "%status %percentage %remaining"
#}

# NetworkManager is used instead of dhclient, so there is no
# dhclient pidfile to watch.
#run_watch DHCP {
#        pidfile = "/var/run/dhclient*.pid"
#}

#run_watch VPN {
#        pidfile = "/var/run/vpnc/pid"
#}

time {
#        format = "%Y-%m-%d %H:%M:%S"
       format = " %a %e %b'%y %l:%M%P"
}

load {
        format = "%1min"
}

disk "/" {
        format = "%free"
}
